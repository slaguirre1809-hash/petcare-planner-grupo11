<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | PetCare Planner</title>

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/agenda.css">
</head>

<body data-page="agenda">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div class="page agenda-page">
        <div data-layout-sidebar></div>
        <header class="app-container app-topbar">
            <a class="app-brand" href="../index.html" aria-label="Ir al inicio de PetCare Planner">
                <span class="app-brand__icon" aria-hidden="true">&#128062;</span>
                <span class="app-brand__text">PetCare Planner</span>
            </a>
        </header>

        <main id="main-content" class="app-container">
            <div>
                <section class="agenda-intro">
                    <h2>Agenda de cuidados</h2>

                    <p>
                        Organiza vacunas, paseos, comidas y cuidados importantes
                        para tus mascotas.
                    </p>
                </section>

                <section class="task-form-section">
                    <h2>Agregar cuidado</h2>

                    <form id="task-form">
                        <fieldset>
                            <legend>Informaci&oacute;n de la tarea</legend>

                            <label for="task-pet">Mascota</label>

                            <select id="task-pet">
                                <option value="">Seleccionar mascota</option>
                            </select>

                            <label for="task-title">T&iacute;tulo</label>

                            <input id="task-title" type="text" placeholder="Ej: Vacuna antirr&aacute;bica">

                            <label for="task-description">
                                Descripci&oacute;n
                            </label>

                            <textarea id="task-description" placeholder="Describe el cuidado..."></textarea>

                            <label for="task-date">Fecha</label>

                            <input id="task-date" type="date">

                            <label for="task-time">Hora</label>

                            <input id="task-time" type="time">
                        </fieldset>

                        <button type="submit">
                            Guardar cuidado
                        </button>
                    </form>

                    <p id="task-message"></p>
                </section>

                <section class="filters-section">
                    <h2>Filtrar tareas</h2>

                    <nav class="filters">
                        <button data-filter="all">
                            Todas
                        </button>

                        <button data-filter="overdue">
                            Vencidas
                        </button>

                        <button data-filter="today">
                            Hoy
                        </button>

                        <button data-filter="upcoming">
                            Pr&oacute;ximas
                        </button>

                        <button data-filter="done">
                            Realizadas
                        </button>
                    </nav>
                </section>

                <section id="tasks-list">
                    <h2>Listado de tareas</h2>
                </section>
            </div>
        </main>

        <div data-layout-bottom-nav></div>
        <footer data-layout-footer></footer>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/agenda.js"></script>
</body>

</html>
